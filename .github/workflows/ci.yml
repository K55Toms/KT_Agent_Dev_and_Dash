name: CI

# Runs the project checks on every pull request and on pushes to main.
# Read-only token, no secrets, every action pinned to a full commit SHA.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: macos-15 # the suite assumes macOS paths (/private/tmp)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the reviewed Gitleaks version
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  gitleaks_8.30.1_darwin_arm64.tar.gz" | shasum -a 256 -c -
          mkdir gitleaks-bin
          tar -xzf gitleaks_8.30.1_darwin_arm64.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Gitleaks is the reviewed version
        run: gitleaks version | grep -x "8.30.1"
      - name: Install pinned Python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Role files are in sync with team_source
        run: python3 -I scripts/sync_roles.py --check
      - name: Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # The runner image configures git-lfs filters in the system and user git config,
          # which the dashboard refuses by design. Remove them and use an empty HOME.
          sudo git config --system --remove-section filter.lfs || true
          export HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)"
          python3 -m unittest discover -s tests
      - name: Node tests
        run: node --test tests/*.js

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the reviewed Gitleaks version
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          mkdir gitleaks-bin
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Gitleaks is the reviewed version
        run: gitleaks version | grep -x "8.30.1"
      - name: Secret and forbidden-path scan of the full history
        run: python3 -I scripts/security_check.py history
