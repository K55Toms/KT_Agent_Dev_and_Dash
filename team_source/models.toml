# Shared model policy: one Codex column and one Claude column per role.
# The Codex column is copied from the current .codex/agents/*.toml.
# The Claude column was chosen by the owner on 2026-10-26.
# expert_escalation uses opus/low on Claude because the fable alias is
# credit-gated off at the owner's organisation (S5 finding). The owner may
# switch it to fable/low once credits are enabled and the pairing is re-tested.
# The pairings opus/medium, sonnet/high and sonnet/medium have not been
# exercised against the live API yet.

[agent_evaluation_engineer.codex]
model = "gpt-6.1-sol"
effort = "high"

[agent_evaluation_engineer.claude]
model = "opus"
effort = "high"

